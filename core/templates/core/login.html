{% extends 'core/base.html' %} <!-- Reaproveita o layout principal do sistema. -->
{% load static %} <!-- Habilita o caminho estático usado pelo logo. -->
{% block content %}

<div class="container" style="text-align:center;"> <!-- Agrupa e centraliza o conteúdo do formulário de acesso. -->
    <img src="{% static 'img\logo_preta.png' %}" alt="OmniFrota" style="width:180px;"> <!-- Exibe o logo com descrição alternativa acessível. -->
    <h2>Entrar</h2>

    <form method="post" action="{% url 'login' %}" style="text-align:left;"> <!-- Envia as credenciais para a rota de autenticação. -->
        {% csrf_token %} <!-- Inclui o token exigido para proteger o envio POST. -->
        <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required> <!-- Usa o nome de campo esperado pela view de login. -->
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required> <!-- Oculta a senha digitada e a envia no campo password. -->
        </div>
        <p style="text-align:right; margin-top:-8px;">
            <a href="{% url 'password_reset' %}">Esqueci a senha</a> <!-- Leva ao fluxo de redefinição de senha. -->
        </p>
        <button type="submit" style="width:100%;">ENTRAR</button>
    </form>

    <p><a href="{% url 'registrar' %}">Ainda não tenho uma conta</a></p> <!-- Abre a página de criação de conta. -->
</div>

{% endblock %}
